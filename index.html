<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    // Remove manifest link when accessed through code-server proxy (avoids 400 errors)
    if (location.pathname.startsWith('/proxy/')) {
      document.querySelector('link[rel="manifest"]').remove();
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Simplicadet</title>
  <meta name="description" content="Aplicație pentru evidența și managementul elevilor, permisii și invoiri" />
  <meta name="author" content="Simplicadet" />

  <meta property="og:title" content="Simplicadet" />
  <meta property="og:description" content="Aplicație pentru evidența și managementul elevilor, permisii și invoiri" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="theme-color" content="#000000" />
  <!-- Android Chrome dark nav bar -->
  <meta name="color-scheme" content="dark light">
  <meta name="msapplication-navbutton-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Simplicadet">
  <!-- iOS / Apple touch icons (explicit sizes help iOS pick the best one) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png">
  <!-- PNG favicons for desktop / Android fallback -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png">
</head>

<body>
  <div id="app-splash"
    style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0f1a;color:#cbd5e1;z-index:9999;">
    <div style="display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.02em;">
      <div
        style="width:28px;height:28px;border:3px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite">
      </div>
    </div>
  </div>
  <div id="root"></div>
  <!-- Remote API auto-detect removed: now serverless /api lives on same origin over HTTPS -->
  <!-- Debug overlay: open any page with ?debug=1 to capture console logs on mobile -->
  <script>
    (function () {
      if (location.search.includes('debug=1')) {
        var box = document.createElement('pre');
        box.id = 'debug-log';
        box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;background:rgba(0,0,0,.85);color:#0f0;font:11px/1.3 monospace;padding:6px;z-index:99999;margin:0;border-top:1px solid #333';
        document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box); });
        function push(type, args) {
          var line = '[' + type + '] ' + Array.from(args).map(function (a) { try { return (typeof a === 'object') ? JSON.stringify(a) : String(a); } catch { return '[unserializable]'; } }).join(' ');
          box.textContent += line + '\n'; box.scrollTop = box.scrollHeight;
        }
        ['log', 'warn', 'error'].forEach(function (m) {
          var orig = console[m].bind(console);
          console[m] = function () { push(m, arguments); orig.apply(console, arguments); };
        });
        window.addEventListener('error', function (e) { push('window.error', [e.message]); });
        window.addEventListener('unhandledrejection', function (e) { push('promise', [e.reason]); });
      }
    })();
  </script>
  <script>
    (function () {
      var css = '@keyframes spin{to{transform:rotate(360deg)}}';
      var s = document.createElement('style'); s.innerHTML = css; document.head.appendChild(s);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Service worker registration removed to disable client caching -->
</body>

</html>
