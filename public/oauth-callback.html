<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Se finalizeaz&#259; autentificarea... - Simplicadet</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      :root {
        --bg-light: #f7f7f7;
        --bg-dark: #0f0f0f;
        --text-light: #171717;
        --text-dark: #ededed;
        --glass-light: rgba(255, 255, 255, 0.7);
        --glass-dark: rgba(255, 255, 255, 0.05);
        --border-light: rgba(0, 0, 0, 0.08);
        --border-dark: rgba(255, 255, 255, 0.1);
        --primary: #262626;
        --primary-fg: #fff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #ededed;
          --primary-fg: #000;
        }
        body {
          background-color: var(--bg-dark);
          color: var(--text-dark);
        }
        .bg-gradient {
          background:
            radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.03), transparent 25%),
            radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02), transparent 25%);
        }
        .card {
          background: var(--glass-dark);
          border-color: var(--border-dark);
        }
      }

      @media (prefers-color-scheme: light) {
        body {
          background-color: var(--bg-light);
          color: var(--text-light);
        }
        .bg-gradient {
          background:
            radial-gradient(circle at 15% 50%, rgba(0, 0, 0, 0.02), transparent 25%),
            radial-gradient(circle at 85% 30%, rgba(0, 0, 0, 0.01), transparent 25%);
        }
        .card {
          background: var(--glass-light);
          border-color: var(--border-light);
        }
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .bg-gradient {
        position: fixed;
        inset: 0;
        z-index: -1;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 40px;
        border-radius: 24px;
        border-width: 1px;
        border-style: solid;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        text-align: center;
        box-sizing: border-box;
      }

      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid currentColor;
        opacity: 0.7;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0 0 16px 0;
      }

      .status.error {
        color: #ef4444;
        border-color: #ef4444;
        opacity: 0.95;
      }

      .loader {
        width: 32px;
        height: 32px;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 24px auto;
        opacity: 0.8;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 12px 0;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 32px 0;
        opacity: 0.7;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 0 24px;
        background: var(--primary);
        color: var(--primary-fg);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        border-radius: 12px;
        transition: all 0.2s;
      }
      .btn:hover {
        transform: translateY(-1px);
        opacity: 0.9;
      }

      @media (max-width: 480px) {
        .card {
          padding: 30px 20px;
        }
        h1 {
          font-size: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-gradient"></div>
    <div class="card">
      <div class="status" id="status-tag">Autentificare</div>
      <div class="loader" id="spinner"></div>
      <h1>Se finalizeaz&#259; autentificarea</h1>
      <p>V&#259; rug&#259;m s&#259; a&#537;tepta&#539;i c&#226;teva momente &#238;n timp ce v&#259; conect&#259;m &#238;n siguran&#539;&#259;.</p>
      <a id="back" class="btn" href="/">Anuleaz&#259; &#537;i revino</a>
    </div>

    <script>
      (async function() {
        try {
          const hashParams = new URLSearchParams((window.location.hash || '#').substring(1));
          const queryParams = new URLSearchParams(window.location.search);

          const idToken = hashParams.get('id_token');
          const stateRaw = hashParams.get('state') || queryParams.get('state');
          const error = hashParams.get('error') || queryParams.get('error');

          if (error) {
            document.querySelector('h1').innerText = 'Eroare la autentificare';
            document.querySelector('p').innerText = 'A apărut o problemă: ' + error;
            const status = document.getElementById('status-tag');
            if (status) {
              status.innerText = 'Autentificare eșuată';
              status.classList.add('error');
            }
            const spinner = document.getElementById('spinner');
            if (spinner) {
              spinner.style.borderColor = '#fee2e2';
              spinner.style.borderTopColor = '#ef4444';
              spinner.style.animation = 'none';
            }
            return;
          }

          let callbackUrl = '/';
          if (stateRaw) {
            try {
              const padded = stateRaw.replace(/-/g, '+').replace(/_/g, '/');
              const jsonStr = decodeURIComponent(escape(atob(padded)));
              const stateObj = JSON.parse(jsonStr);
              callbackUrl = stateObj.callbackUrl || '/';
            } catch (decodeErr) {
              console.warn('Could not decode state:', decodeErr);
            }
          }

          if (idToken) {
            const res = await fetch('/api/gis/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credential: idToken, callbackUrl: callbackUrl })
            });
            if (res.ok) {
              window.location.href = callbackUrl;
              return;
            }

            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error || 'Login failed');
          }

          if (window.opener) {
            const code = queryParams.get('code');
            window.opener.postMessage({ type: 'OAUTH_CALLBACK', code: code, state: stateRaw, error: error }, window.location.origin);
            window.close();
            return;
          }

          document.querySelector('h1').innerText = 'Eroare la autentificare';
          document.querySelector('p').innerText = 'Nu s-a primit tokenul de autentificare. Încercați din nou.';
          const status = document.getElementById('status-tag');
          if (status) {
            status.innerText = 'Autentificare eșuată';
            status.classList.add('error');
          }
          const spinner = document.getElementById('spinner');
          if (spinner) {
            spinner.style.borderColor = '#fee2e2';
            spinner.style.borderTopColor = '#ef4444';
            spinner.style.animation = 'none';
          }
        } catch (e) {
          console.error('OAuth callback error:', e);
          document.querySelector('h1').innerText = 'Eroare la autentificare';
          document.querySelector('p').innerText = 'A apărut o eroare: ' + (e.message || e);
          const status = document.getElementById('status-tag');
          if (status) {
            status.innerText = 'Autentificare eșuată';
            status.classList.add('error');
          }
          const spinner = document.getElementById('spinner');
          if (spinner) {
            spinner.style.borderColor = '#fee2e2';
            spinner.style.borderTopColor = '#ef4444';
            spinner.style.animation = 'none';
          }
        }
      })();
    </script>
  </body>
</html>
